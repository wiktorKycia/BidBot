[project]
name = "bidbot"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiodns==4.0.4",
    "aiofiles>=25.1.0",
    "aiohttp[speedups]>=3.13.5",
    "asyncio>=4.0.0",
    "backoff>=2.2.1",
    "beautifulsoup4>=4.14.3",
    "chromadb>=1.5.9",
    "dotenv>=0.9.9",
    "google-genai>=2.4.0",
    "fastapi>=0.136.1",
    "jq>=1.11.0",
    "langchain==1.3.1",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.1",
    "langchain-openai>=1.2.1",
    "lxml==6.1.1",
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
    "pydantic>=2.13.4",
    "pymupdf>=1.27.2.3",
    "python-docx>=1.2.0",
    "pywin32>=311; sys_platform == 'win32'",
    "requests==2.34.2",
    "tabulate>=0.10.0",
    "networkx>=3.6.1",
    "pypdf>=6.11.0",
    "python-docx>=1.2.0",
    "requests==2.34.1",
    "streamlit>=1.57.0",
    "tzdata>=2026.2",
    "unstructured>=0.22.29",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
]

[tool.ruff]
line-length = 152
target-version = "py314"

[tool.ruff.lint]
extend-select = [
    "W",
    "I",
    "B",
    "UP",
    "FURB",
    "E",
    "COM",
    "C4",
    "N",
    "SIM",
]
ignore = [
    "COM812",
    "SIM105"
]
